# Netlify configuration.
# The only build step is the config generator; the repo root is the site.
[build]
  # Fills firebase-config.js from the FIREBASE_* environment variables set in the
  # Netlify dashboard. With none set it leaves the committed file alone.
  command = "node scripts/generate-config.mjs"
  publish = "."

# Serve recipes.json fresh so an edit to the recipe box shows up immediately
# rather than sitting in a CDN cache.
[[headers]]
  for = "/recipes.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
